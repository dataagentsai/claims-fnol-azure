# Azure (Tier 4): the profile's adapters, every one — nothing here leaves the
# stack, so nothing says `why`. It resolves today and runs once Tier 3 has made
# the resources these names point at (infra/main.bicep: Key Vault, APIM,
# Application Insights, PostgreSQL flexible server; infra/hooks/entra-app.sh:
# the Entra app registration). Until then a start fails at the first adapter
# that reaches its resource, never at a missing name.
#
# Nothing here names a deployed resource. Each {env: NAME} is an output of
# infra/main.bicep, set under the same name in the agent container's
# environment (and by azd in .azure/<env>/.env); each {key_vault: name} is a
# secret a module writes. tests/test_infra.py holds both lists to the infra.
apiVersion: harness-overlay/v1
environment: azure
profile: ../harness-profile.yaml

bindings:
  secrets:
    adapter: key-vault
    vault_url: {env: AZURE_KEY_VAULT_ENDPOINT}
  telemetry:
    adapter: azure-monitor-otel
    connection_string: {key_vault: appinsights-connection-string}
  model:
    adapter: apim-ai-gateway
    base_url: {env: APIM_GROQ_BASE_URL}
    api_key: {key_vault: apim-subscription-key}
  state:
    adapter: azure-postgresql-flexible
    url: {key_vault: agent-database-url}
  identity:
    adapter: entra-id
    tenant: {env: AZURE_TENANT_ID}
    audience: api://claims-fnol
    # The app registration's app role (infra/hooks/entra-app.sh) and what it
    # grants at the desk: the handler reads and closes escalations and decides
    # approvals (F-30). A role is a job; the desk checks scopes.
    role_scopes:
      desk.handler: [escalations:read, escalations:review, approvals:read, approvals:decide]
  tool_runtime:
    adapter: mcp-client
    url: {env: CLAIMS_MCP_URL}
  approval:
    adapter: dbos-workflows
    url: {key_vault: agent-database-url}
    name: claims-fnol

app:
  usage_route: false
