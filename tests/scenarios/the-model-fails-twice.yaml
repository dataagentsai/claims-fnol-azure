# esc:tool-unavailable — two failed turns in a row fetch a person, and nothing
# is claimed meanwhile (AHC-0005: a declared degradation path).
apiVersion: awd-scenario/v0
scenario: two failed turns in a row fetch a person
world: ../../../clean-ai-engineering/gates/motor-claims-fnol/worlds/motor-claims-fnol.yaml
as: PH-1001
objective: The model is unreachable twice. Nothing is claimed, nothing changes, and a person takes it.
concern: reliability
discharges: [esc:tool-unavailable, AHC-0005, op:escalate, ext:escalation_desk]
max_turns: 3
step_seconds: 600
actor:
  says:
    - I need some help please
    - are you still there
    - hello?
perturbations:
  - {kind: provider_unavailable, at_call: 1, lasts_s: 1200}
desk:
  resolves: handled
expect:
  - {handed_off: 1}
  - {world: unchanged}
model:
  - says: Hello — I can help with your claims and policies.
    times: 30
